[package]
name = "ragtag-coordinator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Ragtag coordinator binary"

[[bin]]
name = "ragtag-coordinator"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
clap = { version = "4.6.6", features = ["derive"] }
dashmap = "6.1.0"
futures = "0.3.34"
mdns-sd = "0.21.0"
ragtag-core = { path = "../ragtag-core" }
ragtag-proto = { path = "../ragtag-proto" }
ragtag-scheduler = { path = "../ragtag-scheduler" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync", "time", "net"] }
tonic = "0.14.6"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v4"] }

[features]
llama-e2e = []

default = []

[dev-dependencies]
anyhow = "1.0.104"
regex = "1.10"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
tokio-test = "0.4.5"
