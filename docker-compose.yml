services:
  coordinator:
    image: ragtag:latest
    entrypoint: ["/bin/ragtag-coordinator"]
    command:
      - "--grpc"
      - "0.0.0.0:50051"
      - "--http"
      - "0.0.0.0:3000"
      - "--llama-port"
      - "8081"
      - "--llama-host"
      - "127.0.0.1"
      - "--model"
      - "/models/TinyLlama-1.1B-Chat-v1.0-Q4_K_M.gguf"
      - "--total-layers"
      - "22"
      - "--bytes-per-layer"
      - "30000000"
      - "--heartbeat-timeout-secs"
      - "30"
    ports:
      - "3000:3000"
    volumes:
      - "./models:/models:ro"
    networks:
      - ragtag

  node1:
    image: ragtag:latest
    entrypoint: ["/bin/ragtag-node"]
    command:
      - "--coordinator"
      - "coordinator:50051"
      - "--listen"
      - "0.0.0.0:0"
      - "--advertise-host"
      - "0.0.0.0"
      - "--rpc-addr"
      - "node1:50060"
      - "--llama-rpc-server"
      - "llama-rpc-server"
      - "--hostname"
      - "node1"
      - "--stability"
      - "stable"
      - "--node-id"
      - "11111111-1111-1111-1111-111111111111"
      - "--heartbeat-secs"
      - "5"
    depends_on:
      - coordinator
    networks:
      - ragtag

  node2:
    image: ragtag:latest
    entrypoint: ["/bin/ragtag-node"]
    command:
      - "--coordinator"
      - "coordinator:50051"
      - "--listen"
      - "0.0.0.0:0"
      - "--advertise-host"
      - "0.0.0.0"
      - "--rpc-addr"
      - "node2:50060"
      - "--llama-rpc-server"
      - "llama-rpc-server"
      - "--hostname"
      - "node2"
      - "--stability"
      - "stable"
      - "--node-id"
      - "22222222-2222-2222-2222-222222222222"
      - "--heartbeat-secs"
      - "5"
    depends_on:
      - coordinator
    networks:
      - ragtag

networks:
  ragtag:
    driver: bridge
